<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">StudioOps delivery workflow</title>
<desc id="desc">Illustrative workflow from request through isolated build, specialist and lead review, local QA and required hosted qualification, to an authorized release. Hosted qualification and release require operator control.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1">
<stop stop-color="#111426"/>
<stop offset="1" stop-color="#0a1723"/>
</linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
<path d="M0 0 L0 6 L6 3Z" fill="#737f9c"/>
</marker>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<g font-family="Arial, sans-serif">
<text x="54" y="52" font-size="13" fill="#a6b4cd" font-weight="700" letter-spacing="1.8">STUDIOOPS · ILLUSTRATIVE WORKFLOW</text>
<text x="54" y="108" font-size="40" fill="#f5f7fb" font-weight="700" >A clear path from request to release.</text>
<text x="54" y="146" font-size="19" fill="#bcc4d4" font-weight="400" >Shared standards, independent review, and evidence tied to the candidate you intend to ship.</text>
<rect x="54" y="200" width="220" height="305" rx="18" fill="#131b2b" stroke="#303b52"/>
<rect x="72" y="218" width="44" height="42" rx="12" fill="#252e48" stroke="#3b4865"/>
<text x="94" y="247" font-size="22" fill="#bca4ff" font-weight="700" text-anchor="middle">01</text>
<text x="72" y="292" font-size="22" fill="#f5f7fb" font-weight="700" >Request</text>
<text x="72" y="324" font-size="14" fill="#bca4ff" font-weight="700" >Define the outcome</text>
<text x="72" y="369" font-size="14" fill="#bcc4d4" font-weight="400" >User story + acceptance</text>
<text x="72" y="400" font-size="14" fill="#bcc4d4" font-weight="400" >Scope + project standards</text>
<text x="72" y="431" font-size="14" fill="#bcc4d4" font-weight="400" >Risks + safety rules</text>
<path d="M276 350 L288 350" fill="none" stroke="#737f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="292" y="200" width="220" height="305" rx="18" fill="#131b2b" stroke="#303b52"/>
<rect x="310" y="218" width="44" height="42" rx="12" fill="#252e48" stroke="#3b4865"/>
<text x="332" y="247" font-size="22" fill="#80c8ff" font-weight="700" text-anchor="middle">02</text>
<text x="310" y="292" font-size="22" fill="#f5f7fb" font-weight="700" >Isolated build</text>
<text x="310" y="324" font-size="14" fill="#80c8ff" font-weight="700" >Implement + validate</text>
<text x="310" y="369" font-size="14" fill="#bcc4d4" font-weight="400" >Dedicated worktree</text>
<text x="310" y="400" font-size="14" fill="#bcc4d4" font-weight="400" >Project checks + evidence</text>
<text x="310" y="431" font-size="14" fill="#bcc4d4" font-weight="400" >Linked candidate revision</text>
<path d="M514 350 L526 350" fill="none" stroke="#737f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="200" width="220" height="305" rx="18" fill="#131b2b" stroke="#303b52"/>
<rect x="548" y="218" width="44" height="42" rx="12" fill="#252e48" stroke="#3b4865"/>
<text x="570" y="247" font-size="22" fill="#dca6f1" font-weight="700" text-anchor="middle">03</text>
<text x="548" y="292" font-size="20" fill="#f5f7fb" font-weight="700" >Specialist + lead</text>
<text x="548" y="324" font-size="14" fill="#dca6f1" font-weight="700" >Review the candidate</text>
<text x="548" y="369" font-size="14" fill="#bcc4d4" font-weight="400" >Applicable specialist lanes</text>
<text x="548" y="400" font-size="14" fill="#bcc4d4" font-weight="400" >Required primary lead</text>
<text x="548" y="431" font-size="14" fill="#bcc4d4" font-weight="400" >Changes return to builder</text>
<path d="M752 350 L764 350" fill="none" stroke="#737f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="768" y="200" width="220" height="305" rx="18" fill="#131b2b" stroke="#303b52"/>
<rect x="786" y="218" width="44" height="42" rx="12" fill="#252e48" stroke="#3b4865"/>
<text x="808" y="247" font-size="22" fill="#78daca" font-weight="700" text-anchor="middle">04</text>
<text x="786" y="292" font-size="22" fill="#f5f7fb" font-weight="700" >QA qualification</text>
<text x="786" y="324" font-size="14" fill="#78daca" font-weight="700" >Local + required hosted</text>
<text x="786" y="369" font-size="14" fill="#bcc4d4" font-weight="400" >Local QA evidence</text>
<text x="786" y="400" font-size="14" fill="#bcc4d4" font-weight="400" >Hosted HTTPS candidate</text>
<text x="786" y="431" font-size="14" fill="#bcc4d4" font-weight="400" >Isolated production copy</text>
<path d="M990 350 L1002 350" fill="none" stroke="#737f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1006" y="200" width="220" height="305" rx="18" fill="#131b2b" stroke="#303b52"/>
<rect x="1024" y="218" width="44" height="42" rx="12" fill="#252e48" stroke="#3b4865"/>
<text x="1046" y="247" font-size="22" fill="#f3cb80" font-weight="700" text-anchor="middle">05</text>
<text x="1024" y="292" font-size="20" fill="#f5f7fb" font-weight="700" >Authorized release</text>
<text x="1024" y="324" font-size="14" fill="#f3cb80" font-weight="700" >Promote tested revision</text>
<text x="1024" y="369" font-size="14" fill="#bcc4d4" font-weight="400" >Release authority checked</text>
<text x="1024" y="400" font-size="14" fill="#bcc4d4" font-weight="400" >Operator-controlled ship</text>
<text x="1024" y="431" font-size="14" fill="#bcc4d4" font-weight="400" >Verify + preserve rollback</text>
<rect x="54" y="540" width="1172" height="126" rx="18" fill="#111c2b" stroke="#34445d"/>
<text x="78" y="572" font-size="12" fill="#9bbce7" font-weight="700" letter-spacing="1.2">CONFIGURED WORKFLOW</text>
<text x="78" y="602" font-size="19" fill="#edf2fa" font-weight="700" >Intake → build → specialist + lead review → local QA</text>
<text x="715" y="572" font-size="12" fill="#edc986" font-weight="700" letter-spacing="1.2">OPERATOR-CONTROLLED GATES</text>
<text x="715" y="602" font-size="18" fill="#edf2fa" font-weight="700" >Hosted qualification + authorized release</text>
<text x="78" y="640" font-size="16" fill="#bcc4d4" font-weight="400" >Required checks and authorization must match the exact revision. Automation does not replace release prerequisites.</text>
</g>
</svg>
