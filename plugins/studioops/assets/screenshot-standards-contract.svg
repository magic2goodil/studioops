<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">StudioOps project standards</title>
<desc id="desc">Illustrative synthetic Example App project standards are shared with builders and reviewers, with independent specialist and lead review and release requirements.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1">
<stop stop-color="#111426"/>
<stop offset="1" stop-color="#0a1723"/>
</linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
<path d="M0 0 L0 6 L6 3Z" fill="#737f9c"/>
</marker>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<g font-family="Arial, sans-serif">
<text x="54" y="52" font-size="13" fill="#a6b4cd" font-weight="700" letter-spacing="1.8">STUDIOOPS · ILLUSTRATIVE VIEW · SYNTHETIC DATA</text>
<text x="54" y="108" font-size="40" fill="#f5f7fb" font-weight="700" >One engineering contract. Independent review.</text>
<text x="54" y="146" font-size="19" fill="#bcc4d4" font-weight="400" >Project standards travel with the work, from the first builder prompt to the release decision.</text>
<rect x="54" y="196" width="365" height="462" rx="18" fill="#131b2b" stroke="#303b52"/>
<text x="78" y="237" font-size="25" fill="#f5f7fb" font-weight="700" >Example App</text>
<text x="78" y="267" font-size="15" fill="#a7bad4" font-weight="400" >Synthetic project · illustrative files</text>
<rect x="78" y="289" width="317" height="42" rx="10" fill="#202b40" stroke="#303b52"/>
<text x="95" y="316" font-size="16" fill="#75dca7" font-weight="700" >✓</text>
<text x="120" y="316" font-size="17" fill="#dbe4f3" font-weight="400" >engineering.md</text>
<rect x="78" y="342" width="317" height="42" rx="10" fill="#202b40" stroke="#303b52"/>
<text x="95" y="369" font-size="16" fill="#75dca7" font-weight="700" >✓</text>
<text x="120" y="369" font-size="17" fill="#dbe4f3" font-weight="400" >security-privacy.md</text>
<rect x="78" y="395" width="317" height="42" rx="10" fill="#202b40" stroke="#303b52"/>
<text x="95" y="422" font-size="16" fill="#75dca7" font-weight="700" >✓</text>
<text x="120" y="422" font-size="17" fill="#dbe4f3" font-weight="400" >accessibility.md</text>
<rect x="78" y="448" width="317" height="42" rx="10" fill="#202b40" stroke="#303b52"/>
<text x="95" y="475" font-size="16" fill="#75dca7" font-weight="700" >✓</text>
<text x="120" y="475" font-size="17" fill="#dbe4f3" font-weight="400" >performance.md</text>
<rect x="78" y="501" width="317" height="42" rx="10" fill="#202b40" stroke="#303b52"/>
<text x="95" y="528" font-size="16" fill="#75dca7" font-weight="700" >✓</text>
<text x="120" y="528" font-size="17" fill="#dbe4f3" font-weight="400" >testing.md</text>
<rect x="78" y="554" width="317" height="42" rx="10" fill="#202b40" stroke="#303b52"/>
<text x="95" y="581" font-size="16" fill="#75dca7" font-weight="700" >✓</text>
<text x="120" y="581" font-size="17" fill="#dbe4f3" font-weight="400" >release-deployment.md</text>
<path d="M427 427 L454 427" fill="none" stroke="#737f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="466" y="196" width="345" height="205" rx="18" fill="#131b2b" stroke="#303b52"/>
<text x="490" y="231" font-size="12" fill="#9abce8" font-weight="700" letter-spacing="1">01  BUILD WITH CONTEXT</text>
<text x="490" y="271" font-size="26" fill="#f5f7fb" font-weight="700" >Builder</text>
<text x="490" y="310" font-size="18" fill="#bcc4d4" font-weight="400" >Implements within scope</text>
<text x="490" y="340" font-size="18" fill="#bcc4d4" font-weight="400" >Runs the project checks</text>
<text x="490" y="370" font-size="18" fill="#bcc4d4" font-weight="400" >Links revision + evidence</text>
<rect x="466" y="423" width="345" height="235" rx="18" fill="#131b2b" stroke="#303b52"/>
<text x="490" y="458" font-size="12" fill="#d9b3ee" font-weight="700" letter-spacing="1">02  CHALLENGE THE CHANGE</text>
<text x="490" y="498" font-size="26" fill="#f5f7fb" font-weight="700" >Specialist reviewers</text>
<text x="490" y="537" font-size="18" fill="#bcc4d4" font-weight="400" >Check applicable disciplines</text>
<text x="490" y="567" font-size="18" fill="#bcc4d4" font-weight="400" >Record findings and evidence</text>
<text x="490" y="607" font-size="18" fill="#efadbc" font-weight="700" >Request changes when needed</text>
<path d="M819 427 L846 427" fill="none" stroke="#737f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="858" y="196" width="368" height="462" rx="18" fill="#182237" stroke="#4c5c78"/>
<text x="882" y="231" font-size="12" fill="#8bd6c7" font-weight="700" letter-spacing="1">03  LEAD + RELEASE GATES</text>
<text x="882" y="271" font-size="26" fill="#f5f7fb" font-weight="700" >Primary lead review</text>
<text x="882" y="309" font-size="17" fill="#bcc4d4" font-weight="400" >Required before owner handoff</text>
<line x1="882" y1="336" x2="1202" y2="336" stroke="#3d4a61"/>
<text x="882" y="374" font-size="20" fill="#f5f7fb" font-weight="700" >Candidate-bound evidence</text>
<text x="882" y="409" font-size="17" fill="#bcc4d4" font-weight="400" >Local QA + required hosted QA</text>
<text x="882" y="440" font-size="17" fill="#bcc4d4" font-weight="400" >Release authority + rollback</text>
<rect x="882" y="482" width="320" height="106" rx="12" fill="#24302f" stroke="#435f51"/>
<text x="900" y="516" font-size="18" fill="#b3edc9" font-weight="700" >Operator-controlled release</text>
<text x="900" y="548" font-size="17" fill="#bcc4d4" font-weight="400" >Approve only the qualified</text>
<text x="900" y="574" font-size="17" fill="#bcc4d4" font-weight="400" >revision and intended scope.</text>
<text x="882" y="624" font-size="17" fill="#aabbd3" font-weight="400" >Standards inform every gate.</text>
</g>
</svg>
